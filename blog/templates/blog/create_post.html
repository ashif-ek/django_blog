{% extends "base.html" %}

{% block content %}
<h2>Create New Post</h2>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="title" placeholder="Title" class="form-control mb-2">

    <textarea name="content" placeholder="Content" class="form-control mb-2" rows="5"></textarea>

    <button class="btn btn-primary">Create</button>
</form>
{% endblock %}
