{% extends "base.html" %}
{% block title %}Blog{% endblock %}

{% block content %}
<h1 class="mb-4">All Blog Posts</h1>

{% for post in posts %}
<div class="card mb-3">
    <div class="card-body">
        <h3>
            <a href="/blog/{{ post.id }}/">{{ post.title }}</a>
        </h3>
        <p>{{ post.content|truncatewords:25 }}</p>
        <small class="text-muted">{{ post.created }}</small>
    </div>
</div>
{% endfor %}
{% endblock %}
